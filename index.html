<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Truyện Audio — Nghe truyện ngoại tuyến</title>
    <meta
      name="description"
      content="Ứng dụng PWA nghe truyện audio ngoại tuyến, phát nền khi tắt màn hình, tải xuống chương nghe offline, danh sách phát tùy chỉnh và đồng bộ tiến trình đa thiết bị."
    />
    <meta property="og:title" content="Truyện Audio — Nghe truyện ngoại tuyến" />
    <meta
      property="og:description"
      content="Ứng dụng PWA nghe truyện audio ngoại tuyến, phát nền khi tắt màn hình, tải xuống chương nghe offline, danh sách phát tùy chỉnh và đồng bộ tiến trình đa thiết bị."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#111318" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TruyệnAudio" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var mode = localStorage.getItem('truyen_audio_theme') || 'dark';
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = mode === 'dark' || (mode === 'auto' && prefersDark);
        document.documentElement.classList.toggle('dark', isDark);
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body class="bg-[#f6f5f1] text-slate-900 dark:bg-[#111318] dark:text-slate-100 antialiased selection:bg-blue-500/25">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
